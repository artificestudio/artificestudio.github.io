<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ARTIFICE is an architectural and artistic research practice studying the absurd world we have inherited."
    />
    <meta name="theme-color" content="#111111" />
    <title>ARTIFICE</title>
    <link rel="stylesheet" href="styles.css?v=20261010-radio-time" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111111'/%3E%3Cpath d='M10 53 27 11h10l17 42H43l-3-9H24l-3 9Zm17-18h10l-5-14Z' fill='%23f5f5f0'/%3E%3C/svg%3E"
    />
  </head>

  <body class="home-page">
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="ARTIFICE, home">
        <span>ARTIFICE</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="about.html">about</a>
        <a href="projects.html">projects</a>
        <a href="atlas.html">atlas</a>
        <a href="contact.html">contact</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <video
          class="hero-film"
          autoplay
          muted
          loop
          playsinline
          preload="none"
          poster="assets/home-preview.jpg"
          aria-hidden="true"
        >
          <source data-src="assets/home-film.mp4" type="video/mp4" />
        </video>
        <div class="hero-film-mobile" aria-hidden="true"></div>
        <div class="hero-babel-overlay" aria-hidden="true"></div>
        <div class="film-shade" aria-hidden="true"></div>
        <div class="hero-content">
          <h1 id="hero-title">ARTIFICE</h1>
        </div>
        <aside class="artifice-time" aria-label="ARTIFICE time archive">
          <p class="time-small">ARTIFICE TIME <span class="time-sequence" id="time-sequence">01</span></p>
          <p class="time-elapsed" id="time-elapsed">Loading archive…</p>
          <p class="time-place" id="time-place">Architecture, time and memory</p>
          <a class="time-link" id="time-link" href="atlas.html">View in atlas</a>
          <p class="time-method">Approximate years since recorded opening or construction</p>
        </aside>
        <div class="artifice-radio" aria-label="ARTIFICE radio">
          <p class="radio-small">ARTIFICE RADIO <span>001</span></p>
          <p class="radio-track">TECHNO MART</p>
          <div class="radio-controls">
            <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Play Techno Mart recording" aria-pressed="false">PLAY</button>
            <span class="radio-status" id="radio-status" role="status">PRESS PLAY TO LISTEN</span>
          </div>
          <div class="radio-progress" aria-hidden="true"><div id="radio-progress-fill"></div></div>
          <p class="radio-clock" id="radio-clock">00:00 / 00:00</p>
        </div>
        <audio id="home-soundtrack" src="assets/artifice-ambient.mp3" preload="metadata" autoplay loop></audio>
      </section>
    </main>
    <script>
      const film = document.querySelector(".hero-film");
      const desktopFilm = window.matchMedia("(min-width: 781px) and (prefers-reduced-motion: no-preference)");
      function startDesktopFilm() {
        if (!desktopFilm.matches) return;
        const source = film.querySelector("source");
        if (!source.src) {
          source.src = source.dataset.src;
          film.load();
        }
        film.playbackRate = 0.5;
        film.play().catch(() => {});
      }
      startDesktopFilm();
      desktopFilm.addEventListener("change", startDesktopFilm);

      // Existing Techno Mart audio, presented as ARTIFICE Radio.
      const soundtrack = document.getElementById("home-soundtrack");
      const soundToggle = document.getElementById("sound-toggle");
      const radioStatus = document.getElementById("radio-status");
      const radioProgress = document.getElementById("radio-progress-fill");
      const radioClock = document.getElementById("radio-clock");
      let userPaused = false;
      let triedAutoplay = false;
      const twoDigits = value => String(Math.floor(value)).padStart(2, "0");
      const timecode = seconds => Number.isFinite(seconds) ? `${twoDigits(seconds / 60)}:${twoDigits(seconds % 60)}` : "00:00";

      function renderRadio() {
        const playing = !soundtrack.paused && !soundtrack.ended;
        soundToggle.textContent = playing ? "PAUSE" : "PLAY";
        soundToggle.setAttribute("aria-label", playing ? "Pause Techno Mart recording" : "Play Techno Mart recording");
        soundToggle.setAttribute("aria-pressed", String(playing));
        radioStatus.textContent = playing ? "NOW PLAYING" : "PRESS PLAY TO LISTEN";
        const duration = soundtrack.duration;
        radioClock.textContent = timecode(soundtrack.currentTime) + " / " + timecode(duration);
        radioProgress.style.width = Number.isFinite(duration) && duration > 0 ? Math.min(100, soundtrack.currentTime / duration * 100) + "%" : "0%";
      }
      async function playRadio() {
        try { await soundtrack.play(); } catch (_) { renderRadio(); }
      }
      soundToggle.addEventListener("click", () => {
        if (!soundtrack.paused) { userPaused = true; soundtrack.pause(); }
        else { userPaused = false; playRadio(); }
      });
      ["play", "pause", "timeupdate", "loadedmetadata", "ended"].forEach(event => soundtrack.addEventListener(event, renderRadio));
      // Browser autoplay policies vary. Retry only on the visitor's first interaction.
      function unlockRadio(event) {
        if (userPaused || !soundtrack.paused || event.target === soundToggle) return;
        playRadio();
        document.removeEventListener("pointerdown", unlockRadio);
        document.removeEventListener("keydown", unlockRadio);
      }
      document.addEventListener("pointerdown", unlockRadio);
      document.addEventListener("keydown", unlockRadio);
      document.addEventListener("visibilitychange", () => {
        if (document.hidden && !soundtrack.paused) soundtrack.pause();
        else if (!document.hidden && !userPaused && triedAutoplay) playRadio();
      });
      triedAutoplay = true;
      playRadio();
      renderRadio();

      // Only dated Atlas records qualify. Exact construction day is not
      // known, so we display approximate full years, never fake day counts.
      import("./content/places.js").then(({ seedPlaces }) => {
        const candidates = seedPlaces.filter(place =>
          /^\d{4}$/.test(String(place.year || "").trim()) &&
          Number(place.year) <= new Date().getFullYear() &&
          Number(place.year) >= 1800 &&
          place.id && place.name
        );
        const timeElapsed = document.getElementById("time-elapsed");
        const timePlace = document.getElementById("time-place");
        const timeLink = document.getElementById("time-link");
        const sequence = document.getElementById("time-sequence");
        if (!candidates.length) {
          timeElapsed.textContent = "ARCHIVE IN PROGRESS";
          return;
        }
        let queue = [];
        let number = 0;
        function nextPlace() {
          if (!queue.length) {
            queue = [...candidates];
            for (let i = queue.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [queue[i], queue[j]] = [queue[j], queue[i]];
            }
          }
          const place = queue.pop();
          const years = new Date().getFullYear() - Number(place.year);
          timeElapsed.textContent = years + " YEARS";
          timePlace.textContent = place.name.toUpperCase() + " / " + place.city.toUpperCase() + " / " + place.year;
          timeLink.href = "atlas-place.html?id=" + encodeURIComponent(place.id);
          sequence.textContent = String(++number).padStart(2, "0");
        }
        nextPlace();
        setInterval(nextPlace, 5000);
      }).catch(() => {
        document.getElementById("time-elapsed").textContent = "ATLAS UNAVAILABLE";
      });
    </script>
  </body>
</html>
