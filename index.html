<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ARTIFICE is an architectural and artistic research practice studying the absurd world we have inherited."
    />
    <meta name="theme-color" content="#111111" />
    <title>ARTIFICE</title>
    <link rel="stylesheet" href="styles.css?v=20261010-mobile-row" />
    
  <link rel="stylesheet" href="mobile-v3.css?v=3"><link rel="icon" type="image/svg+xml" href="favicon-artifice-times-a.svg?v=20261010"><link rel="shortcut icon" type="image/svg+xml" href="favicon-artifice-times-a.svg?v=20261010"></head>

  <body class="home-page">
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="ARTIFICE, home">
        <span>ARTIFICE</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="about.html">about</a>
        <a href="projects.html">projects</a>
        <a href="atlas.html">atlas</a>
        <a href="contact.html">contact</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <video
          class="hero-film"
          autoplay
          muted
          loop
          playsinline
          preload="none"
          poster="assets/home-preview.jpg"
          aria-hidden="true"
        >
          <source data-src="assets/home-film.mp4" type="video/mp4" />
        </video>
        <div class="hero-film-mobile" aria-hidden="true"></div>
        <div class="hero-babel-overlay" aria-hidden="true"></div>
        <div class="film-shade" aria-hidden="true"></div>
        <div class="hero-content">
          <h1 id="hero-title">ARTIFICE</h1>
        </div>
        <aside class="artifice-time" aria-label="ARTIFICE time archive">
          <p class="time-small">ARTIFICE TIME <span class="time-sequence" id="time-sequence">01</span></p>
          <p class="time-elapsed"><span id="time-elapsed">00,000000000</span><span class="time-unit"> YEARS</span></p>
          <p class="time-place" id="time-place">Architecture, time and memory</p>
          <a class="time-link" id="time-link" href="atlas.html">View in atlas</a>
          <p class="time-method">Counted from 1 January of the recorded year. Exact date unknown.</p>
        </aside>
        <div class="artifice-radio" aria-label="ARTIFICE radio">
          <p class="radio-small">ARTIFICE RADIO <span>001</span></p>
          <p class="radio-track">TECHNO MART</p>
          <div class="radio-controls">
            <button class="radio-skip" id="radio-previous" type="button" aria-label="Back 15 seconds" title="Back 15 seconds"><svg class="radio-control-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="square" aria-hidden="true"><path d="M11 6 4 12l7 6V6Zm9 0-7 6 7 6V6Z"/></svg></button>
            <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Play Techno Mart recording" aria-pressed="false">PLAY</button>
            <button class="radio-skip" id="radio-next" type="button" aria-label="Forward 15 seconds" title="Forward 15 seconds"><svg class="radio-control-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="square" aria-hidden="true"><path d="m4 6 7 6-7 6V6Zm9 0 7 6-7 6V6Z"/></svg></button>
          </div>
          <p class="radio-status" id="radio-status" role="status">PRESS PLAY TO LISTEN</p>
          <div class="radio-progress" aria-hidden="true"><div id="radio-progress-fill"></div></div>
          <p class="radio-clock" id="radio-clock">00:00 / 00:00</p>
        </div>
        <audio id="home-soundtrack" src="assets/artifice-ambient.mp3" preload="metadata" autoplay loop></audio>
      </section>
    </main>
    <script>
      const film = document.querySelector(".hero-film");
      const desktopFilm = window.matchMedia("(min-width: 781px) and (prefers-reduced-motion: no-preference)");
      function startDesktopFilm() {
        if (!desktopFilm.matches) return;
        const source = film.querySelector("source");
        if (!source.src) {
          source.src = source.dataset.src;
          film.load();
        }
        film.playbackRate = 0.5;
        film.play().catch(() => {});
      }
      startDesktopFilm();
      desktopFilm.addEventListener("change", startDesktopFilm);

      // The Atlas records years, not complete construction dates. Count
      // from January 1 of the recorded year as an explicit convention.
      // Nine decimals ensure that the time visibly changes in real time.
      import("./content/places.js?v=20261010-12worlds").then(({ seedPlaces }) => {
        const candidates = seedPlaces.filter(place =>
          Number.isInteger(place.clockYear ?? Number(place.year)) &&
          (place.clockYear ?? Number(place.year)) <= new Date().getFullYear() &&
          (place.clockYear ?? Number(place.year)) >= 1800 &&
          place.id && place.name
        );
        const timeElapsed = document.getElementById("time-elapsed");
        const timePlace = document.getElementById("time-place");
        const timeLink = document.getElementById("time-link");
        const sequence = document.getElementById("time-sequence");
        if (!candidates.length) {
          timeElapsed.textContent = "ARCHIVE IN PROGRESS";
          document.querySelector(".time-unit").hidden = true;
          return;
        }

        const averageYearMilliseconds = 365.2425 * 24 * 60 * 60 * 1000;
        let queue = [];
        let activePlace = null;
        let counter = 0;
        function updateElapsed() {
          if (!activePlace || document.hidden) return;
          const startingPoint = Date.UTC((activePlace.clockYear ?? Number(activePlace.year)), 0, 1);
          const years = Math.max(0, (Date.now() - startingPoint) / averageYearMilliseconds);
          timeElapsed.textContent = years.toFixed(9).replace(".", ",");
        }
        function nextPlace() {
          if (!queue.length) {
            queue = [...candidates];
            for (let i = queue.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [queue[i], queue[j]] = [queue[j], queue[i]];
            }
          }
          if (queue.length > 1 && activePlace && queue[queue.length - 1].id === activePlace.id) {
            [queue[0], queue[queue.length - 1]] = [queue[queue.length - 1], queue[0]];
          }
          activePlace = queue.pop();
          timePlace.textContent = activePlace.name.toUpperCase() + " / " + (activePlace.clockEvent || "Construction / opening") + " / " + (activePlace.clockYear ?? activePlace.year);
          timeLink.href = "atlas-place.html?id=" + encodeURIComponent(activePlace.id);
          sequence.textContent = String(++counter).padStart(2, "0");
          updateElapsed();
        }
        nextPlace();
        setInterval(updateElapsed, 50);
        setInterval(nextPlace, 5000);
        document.addEventListener("visibilitychange", updateElapsed);
      }).catch(() => {
        document.getElementById("time-elapsed").textContent = "ATLAS UNAVAILABLE";
        document.querySelector(".time-unit").hidden = true;
      });
    </script>
  <script defer src="scripts/radio-v3.js?v=3"></script>
  </body>
</html>
