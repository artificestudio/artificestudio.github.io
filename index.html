<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ARTIFICE is an architectural and artistic research practice studying the absurd world we have inherited."
    />
    <meta name="theme-color" content="#111111" />
    <title>ARTIFICE</title>
    <link rel="stylesheet" href="styles.css?v=20261010-home-type" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111111'/%3E%3Cpath d='M10 53 27 11h10l17 42H43l-3-9H24l-3 9Zm17-18h10l-5-14Z' fill='%23f5f5f0'/%3E%3C/svg%3E"
    />
  </head>

  <body class="home-page">
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="ARTIFICE, home">
        <span>ARTIFICE</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="about.html">about</a>
        <a href="projects.html">projects</a>
        <a href="atlas.html">atlas</a>
        <a href="contact.html">contact</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <video
          class="hero-film"
          autoplay
          muted
          loop
          playsinline
          preload="none"
          poster="assets/home-preview.jpg"
          aria-hidden="true"
        >
          <source data-src="assets/home-film.mp4" type="video/mp4" />
        </video>
        <div class="hero-film-mobile" aria-hidden="true"></div>
        <div class="hero-babel-overlay" aria-hidden="true"></div>
        <div class="film-shade" aria-hidden="true"></div>
        <div class="hero-content">
          <h1 id="hero-title">ARTIFICE</h1>
        </div>
        <audio id="home-soundtrack" src="assets/artifice-ambient.mp3" preload="auto" autoplay loop></audio>
        <button class="sound-toggle" id="sound-toggle" type="button" aria-label="Play background music" aria-pressed="false">sound on</button>
      </section>
    </main>
    <script>
      const film = document.querySelector(".hero-film");
      const desktopFilm = window.matchMedia("(min-width: 781px) and (prefers-reduced-motion: no-preference)");
      function startDesktopFilm() {
        if (!desktopFilm.matches) return;
        const source = film.querySelector("source");
        if (!source.src) {
          source.src = source.dataset.src;
          film.load();
        }
        film.playbackRate = 0.5;
        film.play().catch(() => {});
      }
      startDesktopFilm();
      desktopFilm.addEventListener("change", startDesktopFilm);

      const soundtrack = document.getElementById("home-soundtrack");
      const soundToggle = document.getElementById("sound-toggle");
      let soundDisabled = false;
      function updateSoundToggle() {
        const playing = !soundtrack.paused;
        soundToggle.textContent = playing ? "sound off" : "sound on";
        soundToggle.setAttribute("aria-label", playing ? "Pause background music" : "Play background music");
        soundToggle.setAttribute("aria-pressed", String(playing));
      }
      function playSoundtrack() {
        if (soundDisabled || !soundtrack.paused) return;
        soundtrack.play().catch(updateSoundToggle);
      }
      soundtrack.addEventListener("play", updateSoundToggle);
      soundtrack.addEventListener("playing", updateSoundToggle);
      soundtrack.addEventListener("pause", updateSoundToggle);
      soundToggle.addEventListener("click", () => {
        if (soundtrack.paused) {
          soundDisabled = false;
          playSoundtrack();
        } else {
          soundDisabled = true;
          soundtrack.pause();
        }
      });
      function startSoundAfterInteraction(event) {
        if (event.target !== soundToggle) playSoundtrack();
      }
      document.addEventListener("pointerdown", startSoundAfterInteraction);
      document.addEventListener("mousedown", startSoundAfterInteraction);
      document.addEventListener("touchstart", startSoundAfterInteraction, { passive: true });
      document.addEventListener("touchend", startSoundAfterInteraction, { passive: true });
      document.addEventListener("click", startSoundAfterInteraction);
      document.addEventListener("keydown", startSoundAfterInteraction);
      window.addEventListener("pageshow", () => {
        updateSoundToggle();
        playSoundtrack();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) soundtrack.pause();
        else playSoundtrack();
      });
      updateSoundToggle();
      playSoundtrack();
    </script>
  </body>
</html>
