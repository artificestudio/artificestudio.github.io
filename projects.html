<body class="contact-page artifice-projects-clean">
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="ARTIFICE, home"><span>ARTIFICE</span></a>
    <nav aria-label="Main navigation">
      <a href="about.html">about</a>
      <a href="projects.html" aria-current="page">projects</a>
      <a href="atlas.html">atlas</a>
      <a href="contact.html">contact</a>
    </nav>
  </header>

  <main class="projects-clean-main">
    <section id="projects-index-view" aria-labelledby="projects-label">
      <div class="clean-index-heading">
        <h1 id="projects-label">Projects</h1>
        <p><span id="projects-total">02</span> projects</p>
      </div>
      <div class="clean-project-list" id="projects-index-items">
        <article class="clean-project-entry">
          <a class="clean-project-link" href="projects.html?project=la-machine-du-dialogue">
            <figure class="clean-project-figure"><img src="assets/maine-01.webp" alt="La machine du dialogue"></figure>
            <p class="clean-project-metadata">01 &nbsp; Paris, France</p>
            <h2 class="clean-project-title">La machine du dialogue</h2>
          </a>
        </article>
        <article class="clean-project-entry">
          <a class="clean-project-link" href="projects.html?project=dongtan-consumer-city">
            <figure class="clean-project-figure"><img src="assets/projects/dongtan/05-chaebol-map.webp" alt="Dongtan research maps"></figure>
            <p class="clean-project-metadata">02 &nbsp; Hwaseong, South Korea</p>
            <h2 class="clean-project-title">Dongtan: The Making of a Consumer City</h2>
          </a>
        </article>
      </div>
    </section>

    <article id="projects-detail-view" aria-label="Project" hidden>
      <div class="clean-detail-top">
        <a href="projects.html">All projects</a>
        <span id="project-number">01 of 02</span>
      </div>
      <h1 class="clean-detail-title" id="project-title">Project</h1>
      <div class="clean-detail-location">
        <span id="project-location"></span>
        <span id="project-years"></span>
      </div>
      <section class="clean-gallery" aria-label="Project documents">
        <div class="clean-gallery-stage" id="project-stage" role="button" tabindex="0" aria-label="View next project image, or use arrow keys">
          <img id="project-image" src="assets/maine-01.webp" alt="Project documentation">
        </div>
        <div class="clean-gallery-info" aria-live="polite">
          <span id="project-image-count">01 of 01</span>
          <span class="clean-gallery-caption" id="project-caption"></span>
          <div class="clean-gallery-controls">
            <button type="button" id="project-prev">Previous</button>
            <button type="button" id="project-next">Next</button>
          </div>
        </div>
      </section>
      <section class="clean-document-index" aria-label="All project photographs and drawings">
        <div class="clean-documents-heading"><h2>Documents</h2><span id="project-documents-count">00</span></div>
        <div class="clean-document-grid" id="project-thumbnails"></div>
      </section>
      <div class="clean-project-description" id="project-description"></div>
      <a class="clean-other-project" id="other-project" href="projects.html">Another project</a>
    </article>
